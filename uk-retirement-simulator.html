<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Retirement Simulator</title>
</head>
<body>
  <main>
    <h1>UK Retirement Simulator</h1>
    <p>Transparent, deterministic retirement planning for a fictional household.</p>
  </main>

  <script>
    /* ENGINE_START */
    (() => {
      const SCHEMA_VERSION = 1;
      const PRIORITIES = ['privatePension', 'savings', 'cash'];

      const sampleScenario = () => ({
        schemaVersion: SCHEMA_VERSION,
        currency: 'GBP',
        startYear: 2026,
        household: {
          essentialAnnual: 30000,
          preferredAnnual: 36000,
          inflationPct: 2.5,
          endAge: 90,
          drawdownPriority: [...PRIORITIES]
        },
        people: [
          {
            name: 'Person 1', age: 58, retirementAge: 60,
            salary: 45000, annualPensionContribution: 9000,
            privatePension: { pot: 180000, growthPct: 4.5 },
            statePension: { startAge: 67, annualAmount: 12500 }
          },
          {
            name: 'Person 2', age: 56, retirementAge: 60,
            salary: 30000, annualPensionContribution: 6000,
            privatePension: { pot: 120000, growthPct: 4.5 },
            statePension: { startAge: 67, annualAmount: 12500 }
          }
        ],
        cash: { amount: 15000, interestPct: 0 },
        savings: { amount: 50000, interestPct: 3 }
      });

      const validateScenario = (scenario) => {
        const errors = [];
        const error = (field, message) => errors.push({ field, message });
        const nonNegative = (value, field) => {
          if (typeof value !== 'number' || !Number.isFinite(value)) error(field, 'must be a finite number');
          else if (value < 0) error(field, 'must not be negative');
        };
        const nonNegativeInteger = (value, field) => {
          nonNegative(value, field);
          if (typeof value === 'number' && Number.isFinite(value) && !Number.isInteger(value)) error(field, 'must be an integer');
        };

        if (!scenario || typeof scenario !== 'object') return { valid: false, errors: [{ field: 'scenario', message: 'must be an object' }] };
        if (scenario.schemaVersion !== SCHEMA_VERSION) error('schemaVersion', 'must be 1');
        if (scenario.currency !== 'GBP') error('currency', 'must be GBP');
        if (!Number.isInteger(scenario.startYear)) error('startYear', 'must be an integer');

        const household = scenario.household;
        if (!household || typeof household !== 'object') error('household', 'is required');
        else {
          nonNegative(household.essentialAnnual, 'household.essentialAnnual');
          nonNegative(household.preferredAnnual, 'household.preferredAnnual');
          nonNegative(household.inflationPct, 'household.inflationPct');
          nonNegativeInteger(household.endAge, 'household.endAge');
          if (household.preferredAnnual < household.essentialAnnual) error('household.preferredAnnual', 'must be at least household.essentialAnnual');
          if (!Array.isArray(household.drawdownPriority) || household.drawdownPriority.length !== 3 || new Set(household.drawdownPriority).size !== 3 || household.drawdownPriority.some((value) => !PRIORITIES.includes(value))) {
            error('household.drawdownPriority', 'must contain privatePension, savings and cash exactly once');
          }
        }

        if (!Array.isArray(scenario.people) || scenario.people.length === 0) error('people', 'must contain at least one person');
        else scenario.people.forEach((person, index) => {
          const field = (name) => `people[${index}].${name}`;
          if (!person || typeof person !== 'object' || Array.isArray(person)) {
            error(`people[${index}]`, 'must be an object');
            return;
          }
          if (typeof person.name !== 'string' || !person.name.trim()) error(field('name'), 'is required');
          nonNegativeInteger(person.age, field('age'));
          nonNegativeInteger(person.retirementAge, field('retirementAge'));
          nonNegative(person.salary, field('salary'));
          nonNegative(person.annualPensionContribution, field('annualPensionContribution'));
          if (!person.privatePension || typeof person.privatePension !== 'object') error(field('privatePension'), 'is required');
          else { nonNegative(person.privatePension.pot, field('privatePension.pot')); nonNegative(person.privatePension.growthPct, field('privatePension.growthPct')); }
          if (!person.statePension || typeof person.statePension !== 'object') error(field('statePension'), 'is required');
          else { nonNegativeInteger(person.statePension.startAge, field('statePension.startAge')); nonNegative(person.statePension.annualAmount, field('statePension.annualAmount')); }
        });

        if (scenario.household && typeof scenario.household === 'object' && Array.isArray(scenario.people)) {
          const currentAges = scenario.people
            .filter((person) => person && typeof person === 'object' && typeof person.age === 'number' && Number.isFinite(person.age))
            .map((person) => person.age);
          if (currentAges.length > 0 && typeof scenario.household.endAge === 'number' && Number.isFinite(scenario.household.endAge) && scenario.household.endAge < Math.max(...currentAges)) {
            error('household.endAge', 'must be at least the oldest current person age');
          }
        }

        for (const name of ['cash', 'savings']) {
          if (!scenario[name] || typeof scenario[name] !== 'object') error(name, 'is required');
          else { nonNegative(scenario[name].amount, `${name}.amount`); nonNegative(scenario[name].interestPct, `${name}.interestPct`); }
        }
        return { valid: errors.length === 0, errors };
      };

      const migrateScenario = (raw) => {
        const scenario = JSON.parse(JSON.stringify(raw));
        if (scenario.schemaVersion === undefined) scenario.schemaVersion = SCHEMA_VERSION;
        if (scenario.currency === undefined) scenario.currency = 'GBP';
        if (scenario.household && scenario.household.drawdownPriority === undefined) scenario.household.drawdownPriority = [...PRIORITIES];
        return scenario;
      };

      const sum = (values) => values.reduce((total, value) => total + value, 0);
      const clone = (value) => JSON.parse(JSON.stringify(value));
      const scaleMoney = (value, factor) => {
        if (typeof value === 'number') return value / factor;
        if (Array.isArray(value)) return value.map((item) => scaleMoney(item, factor));
        if (value && typeof value === 'object') {
          return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, scaleMoney(item, factor)]));
        }
        return value;
      };

      const projectScenario = (scenario) => {
        const validation = validateScenario(scenario);
        if (!validation.valid) throw new Error(`Invalid scenario: ${JSON.stringify(validation.errors)}`);

        const people = scenario.people;
        const household = scenario.household;
        const initialAges = people.map((person) => person.age);
        const anchorAge = Math.max(...initialAges);
        const years = household.endAge - anchorAge + 1;
        if (years <= 0) return [];

        const balances = {
          privatePension: people.map((person) => person.privatePension.pot),
          savings: scenario.savings.amount,
          cash: scenario.cash.amount
        };
        const firstDepletionYear = {
          privatePension: people.map(() => null),
          savings: null,
          cash: null
        };
        const rows = [];

        for (let yearIndex = 0; yearIndex < years; yearIndex += 1) {
          const year = scenario.startYear + yearIndex;
          const ages = initialAges.map((age) => age + yearIndex);
          const salary = people.map((person, index) => ages[index] < person.retirementAge ? person.salary : 0);
          const contributions = people.map((person, index) => ages[index] < person.retirementAge ? person.annualPensionContribution : 0);

          // Contributions are added before growth; salary remains income and is not silently saved.
          const privateGrowth = people.map((person, index) => {
            const growthBase = balances.privatePension[index] + contributions[index];
            const growth = growthBase * person.privatePension.growthPct / 100;
            balances.privatePension[index] = growthBase + growth;
            return growth;
          });
          const savingsGrowth = balances.savings * scenario.savings.interestPct / 100;
          const cashGrowth = balances.cash * scenario.cash.interestPct / 100;
          balances.savings += savingsGrowth;
          balances.cash += cashGrowth;

          const statePension = people.map((person, index) => ages[index] >= person.statePension.startAge ? person.statePension.annualAmount : 0);
          const income = {
            salary: sum(salary),
            statePension: sum(statePension),
            total: sum(salary) + sum(statePension)
          };
          const inflationFactor = (1 + household.inflationPct / 100) ** yearIndex;
          const preferred = household.preferredAnnual * inflationFactor;
          const essential = household.essentialAnnual * inflationFactor;
          const draws = {
            privatePension: people.map(() => 0),
            savings: 0,
            cash: 0,
            total: 0
          };
          let required = Math.max(0, preferred - income.total);

          const drawSource = (available, assign) => {
            const amount = Math.min(available, required);
            assign(amount);
            required -= amount;
            draws.total += amount;
          };

          for (const priority of household.drawdownPriority) {
            if (required <= 0) break;
            if (priority === 'privatePension') {
              for (let index = 0; index < people.length && required > 0; index += 1) {
                drawSource(balances.privatePension[index], (amount) => {
                  draws.privatePension[index] = amount;
                  balances.privatePension[index] -= amount;
                });
              }
            } else if (priority === 'savings') {
              drawSource(balances.savings, (amount) => {
                draws.savings = amount;
                balances.savings -= amount;
              });
            } else if (priority === 'cash') {
              drawSource(balances.cash, (amount) => {
                draws.cash = amount;
                balances.cash -= amount;
              });
            }
          }

          balances.privatePension = balances.privatePension.map((balance) => Math.max(0, balance));
          balances.savings = Math.max(0, balances.savings);
          balances.cash = Math.max(0, balances.cash);
          const totalIncomeAndDraws = income.total + draws.total;
          const spending = {
            preferred,
            essential,
            availableIncome: income.total,
            funded: Math.min(preferred, totalIncomeAndDraws),
            preferredShortfall: Math.max(0, preferred - totalIncomeAndDraws),
            essentialCovered: totalIncomeAndDraws >= essential,
            essentialShortfall: Math.max(0, essential - totalIncomeAndDraws),
            surplus: Math.max(0, totalIncomeAndDraws - preferred)
          };
          const depletion = {
            privatePension: balances.privatePension.map((balance, index) => {
              const depleted = balance === 0;
              if (depleted && firstDepletionYear.privatePension[index] === null) firstDepletionYear.privatePension[index] = year;
              return depleted;
            }),
            savings: balances.savings === 0,
            cash: balances.cash === 0
          };
          if (depletion.savings && firstDepletionYear.savings === null) firstDepletionYear.savings = year;
          if (depletion.cash && firstDepletionYear.cash === null) firstDepletionYear.cash = year;

          const nominal = {
            salary: clone(salary),
            contributions: clone(contributions),
            statePension: clone(statePension),
            income: clone(income),
            growth: { privatePension: clone(privateGrowth), savings: savingsGrowth, cash: cashGrowth },
            draws: clone(draws),
            balances: clone(balances),
            spending: clone(spending)
          };
          rows.push({
            year,
            ages,
            salary,
            contributions,
            statePension,
            income,
            growth: nominal.growth,
            draws,
            balances: nominal.balances,
            spending,
            depletion,
            depletionYear: clone(firstDepletionYear),
            nominal,
            todaysMoney: scaleMoney(nominal, inflationFactor)
          });
        }
        return rows;
      };

      globalThis.SCHEMA_VERSION = SCHEMA_VERSION;
      globalThis.sampleScenario = sampleScenario;
      globalThis.validateScenario = validateScenario;
      globalThis.migrateScenario = migrateScenario;
      globalThis.projectScenario = projectScenario;
    })();
    /* ENGINE_END */
  </script>
</body>
</html>
