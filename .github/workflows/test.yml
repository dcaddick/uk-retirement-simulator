name: Regression tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression suite
        run: node --test tests/uk-retirement-simulator.test.mjs
      - name: Check for stray whitespace
        run: git diff --check
